# Review policy (Combined Plan section 4). Read by softsignal/policy.py.
cap_false_teen: 0.15    # max share of adults sent to verification
review_budget: 0.25     # max share of a batch in the verify band (reported, not enforced: the cap wins)
soft_recall: 0.90       # share of teens the soft band and above must reach
min_audit_adults: 120   # hold rule floor: no re-tune before this many audit adults (enforced by loop.py)
audit_per_batch: 60     # random audit accounts revealed per batch (read by oracle.py)
cap_margin: 0.0        # verify cutoff aims at cap - margin. 0.0 = no margin; not yet measured, pick from train folds or audit labels, never test
psi_drift: 0.25       # A1 fallback: drift is real when a feature-group or score PSI reaches this. 0.25 = the usual
                      # 'large shift'. Measured (python -m softsignal.agents.a1_drift --calibrate: batch vs earlier
                      # batches, 10 oracle seeds x rounds 2-7 = 60 no-drift batches): max 0.161, 99th pct 0.149, so 0
                      # false alarms (bounds the per-batch rate to about 5%, 95% conf.). Mean shifts of 0.58-1.16 sd in
                      # one feature gave PSI 0.66-2.66.
